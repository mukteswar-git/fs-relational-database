name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable
      PORT: 3001
      SECRET: test_secret

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check environment
        run: |
          echo "DATABASE_URL is set: ${DATABASE_URL:+yes}"
          echo "PORT=$PORT"
          echo "SECRET is set: ${SECRET:+yes}"

      - name: Test Node environment
        run: node -e "console.log('Node DATABASE_URL:', process.env.DATABASE_URL ? 'SET' : 'MISSING')"

      - name: Start application
        run: npm run start:test > app.log 2>&1 &

      - name: Wait for application to be ready
        run: npx wait-on http://localhost:3001 -t 30000

      - name: Run tests
        run: npm test

      - name: Print application logs on failure
        if: failure()
        run: cat app.log

      - name: Stop application
        if: always()
        run: pkill -f "node index.js" || true
