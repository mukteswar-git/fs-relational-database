name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable
      PORT: 3001
      SECRET: test_secret

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check environment
        run: |
          echo "DATABASE_URL is set: ${DATABASE_URL:+yes}"
          echo "TEST_DATABASE_URL is set: ${TEST_DATABASE_URL:+yes}"
          echo "PORT=$PORT"
          echo "SECRET is set: ${SECRET:+yes}"

          TESTING=true node -e "
            const config = require('./util/config')
            console.log('TESTING:', process.env.TESTING)
            console.log('process.TEST_DATABASE_URL:', process.env.TEST_DATABASE_URL ? 'SET' : 'MISSING')
            console.log('config.TEST_DATABASE_URL:', config.TEST_DATABASE_URL ? 'SET' : 'MISSING')
            console.log('config.DATABASE_URL:', config.DATABASE_URL ? 'SET' : 'MISSING')
          "

      - name: Start application
        run: |
          npm run start:test > app.log 2>&1 &
          sleep 5
          cat app.log

      - name: Run tests
        run: npm test

      - name: Print application logs on failure
        if: failure()
        run: cat app.log

      - name: Stop application
        if: always()
        run: pkill -f "node index.js" || true
